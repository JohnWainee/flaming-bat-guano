version: "3.9"

x-common-env: &common-env
  env_file: .env

services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    <<: *common-env
    environment:
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  teams-bot:
    build:
      context: .
      dockerfile: services/teams_bot/Dockerfile
    ports:
      - "3978:3978"
    <<: *common-env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

  email-ingestor:
    build:
      context: .
      dockerfile: services/email_ingestor/Dockerfile
    <<: *common-env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

  ingestion-pipeline:
    build:
      context: .
      dockerfile: services/ingestion_pipeline/Dockerfile
    <<: *common-env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
      - orchestrator
    restart: "no"
    volumes:
      - ingestion_cursor:/data

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "8501:8501"
    <<: *common-env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
      - orchestrator
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  ingestion_cursor:
