# Apply with: kubectl create secret generic snow-assistant-secrets --from-env-file=.env
# Or reference this template and fill in base64-encoded values
apiVersion: v1
kind: Secret
metadata:
  name: snow-assistant-secrets
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: "https://your-resource.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "your-api-key"
  AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  SNOW_INSTANCE_URL: "https://your-instance.service-now.com"
  SNOW_AUTH_METHOD: "basic"
  SNOW_USERNAME: "api-service-account"
  SNOW_PASSWORD: "your-password"
  MICROSOFT_APP_ID: "your-bot-app-id"
  MICROSOFT_APP_PASSWORD: "your-bot-app-password"
  EMAIL_HOST: "mail.yourcompany.com"
  EMAIL_USERNAME: "snow-intake@yourcompany.com"
  EMAIL_PASSWORD: "your-email-password"
